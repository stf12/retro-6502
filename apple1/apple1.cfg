# Apple I memory map for ld65: user programs traditionally start at $0280
# ($0200-$027F is the Woz Monitor input buffer). A stock Apple I has 4 KB
# of RAM, so the program must end before $1000.
MEMORY {
    ZP:  start = $0000, size = $0100, type = rw;
    RAM: start = $0280, size = $0D80, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp, optional = yes;
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro, optional = yes;
    DATA:     load = RAM, type = rw, optional = yes;
    BSS:      load = RAM, type = bss, optional = yes;
}

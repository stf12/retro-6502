# ld65 linker config: produces a full 64 KB memory image for the Chiplab host.
#   $0000-$00FF  zero page
#   $0100-$01FF  stack
#   $0200-$7FFF  RAM (variables: BSS segment)
#   $8000-$FFF9  program (CODE, RODATA)
#   $FFFA-$FFFF  NMI / RESET / IRQ vectors
MEMORY {
    ZP:   start = $0000, size = $0100, fill = yes, fillval = $00, file = %O;
    STK:  start = $0100, size = $0100, fill = yes, fillval = $00, file = %O;
    RAM:  start = $0200, size = $7E00, fill = yes, fillval = $00, file = %O;
    ROM:  start = $8000, size = $7FFA, fill = yes, fillval = $EA, file = %O;
    VEC:  start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    BSS:      load = RAM, type = bss, optional = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro,  optional = yes;
    VECTORS:  load = VEC, type = ro;
}

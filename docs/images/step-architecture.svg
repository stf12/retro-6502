<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How step() connects the devices and the tracer</title>

<g text-anchor="middle" font-size="14" font-weight="500">
<text x="115" y="173" fill="#444441">Chiplab board</text>
<text x="335" y="171" fill="#3C3489">step()</text>
<text x="560" y="52" fill="#444441">Memory, 64 KB</text>
<text x="560" y="114" fill="#444441">Keyboard $F004</text>
<text x="560" y="176" fill="#444441">Console $F001</text>
<text x="560" y="238" fill="#444441">Exit $F000</text>
<text x="560" y="300" fill="#085041">GFX chip</text>
<text x="335" y="311" fill="#085041">Disassembled trace</text>
</g>
<g text-anchor="middle" font-size="12">
<text x="115" y="192" fill="#5F5E5A">address, R/W, data</text>
<text x="335" y="192" fill="#534AB7">who answers</text>
<text x="335" y="208" fill="#534AB7">this address?</text>
<text x="560" y="71" fill="#5F5E5A">everything else</text>
<text x="560" y="133" fill="#5F5E5A">reads</text>
<text x="560" y="195" fill="#5F5E5A">writes</text>
<text x="560" y="257" fill="#5F5E5A">writes</text>
<text x="560" y="319" fill="#0F6E56">$F010–$F03F, R/W</text>
<text x="335" y="330" fill="#0F6E56">watches, changes nothing</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Protocol 0.2 timing: two read cycles of LDA #$42</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="410" fill="#ffffff"/>
<g font-size="12" fill="#5F5E5A">
<path d="M165 42 V36 H480 V42" fill="none" stroke="#888780" stroke-width="0.8"/>
<text x="322" y="28" text-anchor="middle">one USB round trip = one 6502 cycle</text>
</g>
<g font-size="14" font-weight="500" fill="#2C2C2A">
<text x="30" y="66">Mac ↔ board</text>
<text x="30" y="156">Data bus</text>
<text x="30" y="244">Clock PHI2</text>
<text x="30" y="316">Address bus</text>
</g>
<g font-size="12" fill="#5F5E5A">
<text x="30" y="84">over USB</text>
<text x="30" y="174">board → 6502</text>
<text x="30" y="334">6502 → board</text>
</g>
<rect x="165" y="56" width="60" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="195" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">x169</text>
<rect x="372" y="56" width="108" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="426" y="74" text-anchor="middle" font-size="12" fill="#444441">a=0x8001 r=1</text>
<rect x="490" y="56" width="55" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="517" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">x66</text>
<line x1="195" y1="86" x2="232" y2="146" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="517" y1="86" x2="556" y2="146" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="232" y="148" width="98" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="270" y="165" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">$A9</text>
<line x1="330" y1="160" x2="556" y2="160" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="443" y="144" text-anchor="middle" font-size="12" fill="#5F5E5A">bus released</text>
<rect x="556" y="148" width="74" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="576" y="165" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">$42</text>
<text x="480" y="209" text-anchor="middle" font-size="12" fill="#5F5E5A">the 6502 waits, clock stopped</text>
<path d="M160 222 H300 V258 H360 V222 H600 V258 H650" fill="none" stroke="#5F5E5A" stroke-width="2"/>
<rect x="160" y="300" width="144" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="232" y="316" text-anchor="middle" font-size="12" fill="#444441">$8000 (opcode)</text>
<rect x="308" y="300" width="294" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="455" y="316" text-anchor="middle" font-size="12" fill="#444441">$8001 (operand)</text>
<rect x="606" y="300" width="44" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="628" y="316" text-anchor="middle" font-size="12" fill="#444441">$8002</text>
<line x1="300" y1="96" x2="300" y2="340" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="600" y1="96" x2="600" y2="340" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 3"/>
<g font-size="12" fill="#993C1D" text-anchor="middle">
<text x="300" y="358">reads $A9</text>
<text x="600" y="358">reads $42</text>
</g>
<text x="400" y="390" text-anchor="middle" font-size="12" fill="#5F5E5A">Dashed lines: clock falling edge, the 6502 reads the data bus</text>
</svg>
